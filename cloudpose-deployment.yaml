apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudpose-deployment
spec:
  # replicas: 1 # 作业要求一开始先使用1个pod，后续再扩展
  # replicas: 2 # 现在是第二轮压测，先扩展到2个pod
  # replicas: 8 # 现在是第三轮压测，直接扩展到8个pod
  replicas: 1  # 此时准备进行另一个压测了，上面的 3 个都是 Locust 从本地发起的；下面开始 Locust 从另一个远程服务器里发起。
  selector:
    matchLabels:
      app: cloudpose
  template:
    metadata:
      labels:
        app: cloudpose
    spec:
      containers:
        - name: cloudpose
          image: coolguyinurarea/cloudpose:v2
          ports:
          - containerPort: 60000
          resources:
            requests:
              cpu: "0.5"
              memory: "1024Mi"
            limits:
              cpu: "0.5"
              memory: "1024Mi"
          